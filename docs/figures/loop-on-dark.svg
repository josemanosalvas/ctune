<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 204" width="880" height="204" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>One step of a campaign</title><desc>Plan, apply, verify, test, verdict. The last green configuration is the baseline for the next step, and every stage writes to the journal.</desc><path d="M792.0 50V28Q792.0 20 784.0 20H96.0Q88.0 20 88.0 28V48" fill="none" stroke="#d97757" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M84.0 42L88.0 48L92.0 42" fill="none" stroke="#d97757" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="244.0" y="10.0" width="392.0" height="20.0" rx="0" fill="#0d1117"/><text x="440.0" y="24.0" font-size="11.5" fill="#c3c2b7" text-anchor="middle" font-weight="400">the last green configuration is the baseline for the next step</text><rect x="20.0" y="50.0" width="136.0" height="44.0" rx="8" fill="#151b23" stroke="#3d444d"/><text x="88.0" y="77.0" font-size="14" fill="#f0efec" text-anchor="middle" font-weight="600">Plan</text><text x="88.0" y="115.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">one variable and</text><text x="88.0" y="129.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">its rollback value</text><rect x="196.0" y="50.0" width="136.0" height="44.0" rx="8" fill="#151b23" stroke="#3d444d"/><text x="264.0" y="77.0" font-size="14" fill="#f0efec" text-anchor="middle" font-weight="600">Apply</text><text x="264.0" y="115.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">ctune for CPU and GPU,</text><text x="264.0" y="129.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">you in the BIOS for RAM</text><line x1="163.0" y1="72.0" x2="189.0" y2="72.0" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round"/><path d="M183.0 68.0L189.0 72.0L183.0 76.0" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="372.0" y="50.0" width="136.0" height="44.0" rx="8" fill="#151b23" stroke="#3d444d"/><text x="440.0" y="77.0" font-size="14" fill="#f0efec" text-anchor="middle" font-weight="600">Verify</text><text x="440.0" y="115.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">read the setting back</text><text x="440.0" y="129.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">from the hardware</text><line x1="339.0" y1="72.0" x2="365.0" y2="72.0" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round"/><path d="M359.0 68.0L365.0 72.0L359.0 76.0" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="548.0" y="50.0" width="136.0" height="44.0" rx="8" fill="#151b23" stroke="#3d444d"/><text x="616.0" y="77.0" font-size="14" fill="#f0efec" text-anchor="middle" font-weight="600">Test</text><text x="616.0" y="115.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">loads that check</text><text x="616.0" y="129.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">their own results</text><line x1="515.0" y1="72.0" x2="541.0" y2="72.0" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round"/><path d="M535.0 68.0L541.0 72.0L535.0 76.0" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="724.0" y="50.0" width="136.0" height="44.0" rx="8" fill="#151b23" stroke="#3d444d"/><text x="792.0" y="77.0" font-size="14" fill="#f0efec" text-anchor="middle" font-weight="600">Verdict</text><text x="792.0" y="115.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">green, red or</text><text x="792.0" y="129.0" font-size="11" fill="#c3c2b7" text-anchor="middle" font-weight="400">inconclusive</text><line x1="691.0" y1="72.0" x2="717.0" y2="72.0" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round"/><path d="M711.0 68.0L717.0 72.0L711.0 76.0" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><line x1="88.0" y1="138.0" x2="88.0" y2="147.0" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round"/><path d="M84.0 141.0L88.0 147.0L92.0 141.0" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="264.0" y1="138.0" x2="264.0" y2="147.0" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round"/><path d="M260.0 141.0L264.0 147.0L268.0 141.0" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="440.0" y1="138.0" x2="440.0" y2="147.0" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round"/><path d="M436.0 141.0L440.0 147.0L444.0 141.0" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="616.0" y1="138.0" x2="616.0" y2="147.0" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round"/><path d="M612.0 141.0L616.0 147.0L620.0 141.0" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><line x1="792.0" y1="138.0" x2="792.0" y2="147.0" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round"/><path d="M788.0 141.0L792.0 147.0L796.0 141.0" fill="none" stroke="#3d444d" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><rect x="20.0" y="152.0" width="840.0" height="36.0" rx="8" fill="#151b23" stroke="#3d444d"/><text x="440.0" y="174.0" font-size="12" fill="#f0efec" text-anchor="middle" font-weight="400">Journal: every plan, change and verdict, with the snapshot it was measured on</text></svg>
