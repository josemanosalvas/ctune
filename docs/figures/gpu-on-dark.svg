<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>A tuned RTX 3080 Ti against stock</title><desc>Performance falls by 0.5 to 3.1 percent while power, energy and fan speed fall by 10 to 13 percent.</desc><text x="20.0" y="22.0" font-size="12.5" fill="#f0efec" text-anchor="start" font-weight="600">Performance given up</text><text x="20.0" y="46.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">gpu-burn, FP32</text><path d="M560.0 34.0H531.1Q527.1 34.0 527.1 38.0V44.0Q527.1 48.0 531.1 48.0H560.0Z" fill="#898781"/><text x="520.1" y="45.5" font-size="11.5" fill="#f0efec" text-anchor="end" font-weight="600">−1.7 %</text><text x="584.0" y="46.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">26,362 to 25,905 GFLOPS</text><text x="20.0" y="73.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">gpu-burn, FP64</text><path d="M560.0 61.0H504.1Q500.1 61.0 500.1 65.0V71.0Q500.1 75.0 504.1 75.0H560.0Z" fill="#898781"/><text x="493.1" y="72.5" font-size="11.5" fill="#f0efec" text-anchor="end" font-weight="600">−3.1 %</text><text x="584.0" y="73.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">540 to 523 GFLOPS</text><text x="20.0" y="100.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Quake II RTX</text><path d="M560.0 88.0H540.8Q536.8 88.0 536.8 92.0V98.0Q536.8 102.0 540.8 102.0H560.0Z" fill="#898781"/><text x="529.8" y="99.5" font-size="11.5" fill="#f0efec" text-anchor="end" font-weight="600">−1.2 %</text><text x="584.0" y="100.0" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">96.0 to 94.8 fps</text><text x="20.0" y="127.0" font-size="12" fill="#c3c2b7" text-anchor="start" font-weight="400">Unigine Superposition</text><path d="M560.0 115.0H542.7Q538.7 115.0 538.7 119.0V125.0Q538.7 129.0 542.7 129.0H560.0Z" fill="#898781