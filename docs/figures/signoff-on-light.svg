<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>The sign-off suite</title><desc>Eight phases over seven hours: two for RAM, three for the CPU, one for the GPU, a combined load and an idle soak.</desc><rect x="20.0" y="9.0" width="10.0" height="10.0" rx="2" fill="#2a78d6"/><text x="36.0" y="18.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">RAM</text><rect x="74.9" y="9.0" width="10.0" height="10.0" rx="2" fill="#eb6834"/><text x="90.9" y="18.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">CPU</text><rect x="129.8" y="9.0" width="10.0" height="10.0" rx="2" fill="#1baf7a"/><text x="145.8" y="18.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">GPU</text><rect x="184.7" y="9.0" width="10.0" height="10.0" rx="2" fill="#6250d6"/><text x="200.7" y="18.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">RAM, GPU and NVMe at once</text><rect x="378.2" y="9.0" width="10.0" height="10.0" rx="2" fill="#898781"/><text x="394.2" y="18.0" font-size="11.5" fill="#52514e" text-anchor="start" font-weight="400">Nothing running</text><rect x="20.0" y="34.0" width="118.3" height="28.0" rx="4" fill="#2a78d6"/><text x="28.0" y="52.5" font-size="11" font-weight="600" fill="#ffffff">60 min</text><text x="21.0" y="79.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">RAM stress</text><text x="21.0" y="93.0" font-size="10.5" fill="#898781" text-anchor="start" font-weight="400">stressapptest</text><rect x="140.3" y="34.0" width="177.4" height="28.0" rx="4" fill="#2a78d6"/><text x="148.3" y="52.5" font-size="11" font-weight="600" fill="#ffffff">90 min</text><text x="141.3" y="79.0" font-size="11.5" fill="#0b0b0b" text-anchor="start" font-weight="600">TestMem5</text><text x="141.3" y="93.0" font-size="10.5" fill="#898781" text-anchor="start" font-wei